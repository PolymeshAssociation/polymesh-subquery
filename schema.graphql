# ---------------------------------------------------------------------------
# POLYX ledger (plan 02). PolyxEntry + AccountBalance replace PolyxTransaction
# and BalanceTypeEnum, which are removed once the reconciliation harness is
# green. Until then both models exist side by side.
# ---------------------------------------------------------------------------

"The two balance pools an account holds on chain. `Bonded`/`Unbonded`/`Locked` are not pools and are not represented here."
enum PolyxPool {
  Free
  Reserved
}

"Which side of a movement an entry records."
enum EntryDirection {
  Debit
  Credit
}

"Why POLYX is held in `reserved` under the v8 fungible-Holds API."
enum HoldReason {
  Staking
  Session
  Preimage
  Revive
  Unknown
}

"What an entry's movement represents. Denormalised onto the entry so aggregation does not need to traverse relations."
enum MovementKind {
  Transfer
  Endowment
  Fee
  Tip
  TreasuryDisbursement
  TreasuryReimbursement
  StakingReward
  Slash
  Mint
  Burn
  DustLost
  ReserveRepatriation
  Hold
  Release
  BalanceSetAdjustment
}

type KindTotal @jsonField {
  "a `MovementKind` value — jsonField members cannot be enum-typed, same as `Scope.type` etc."
  kind: String!
  totalAbs: BigInt!
  net: BigInt!
  count: Int!
}

type LockEntry @jsonField {
  lockId: String!
  amount: BigInt!
  reasons: String
}

type HoldEntry @jsonField {
  "a `HoldReason` value — jsonField members cannot be enum-typed"
  reason: String!
  amount: BigInt!
}

"""
One row per (account, movement side). Append-only.
Sibling entries of one on-chain movement share `movementId`.
"""
type PolyxEntry @entity @compositeIndexes(fields: [["account", "date"], ["account", "kind"], ["kind", "date"]]) {
  "padId(block)/padId(eventIdx)/side  — D4"
  id: ID!
  movementId: String! @index

  account: Account!
  identity: Identity
  "indexed in db/compat.sql — the schema is at the platform's 10-index-per-entity cap"
  counterpartyAddress: String
  counterpartyIdentity: Identity

  pool: PolyxPool!
  "signed: negative = debit, positive = credit. SUM = net delta"
  amount: BigInt!
  "unsigned. SUM = gross volume"
  amountAbs: BigInt!

  kind: MovementKind!
  "materialised — sign(amount) is not groupable (§8b)"
  direction: EntryDirection!
  holdReason: HoldReason
  memo: String

  "balance after this entry — powers charts with no aggregation"
  freeAfter: BigInt!
  reservedAfter: BigInt!
  frozenAfter: BigInt!

  "denormalised — aggregation cannot traverse relations"
  moduleId: ModuleIdEnum
  callId: CallIdEnum
  eventId: EventIdEnum!
  specVersionId: Int!
  "materialised time buckets — no date_trunc grouping exists (§8b). Indexed via the `[kind, date]` / `[account, date]` composites and a standalone index in db/compat.sql"
  date: Date!
  "indexed in db/compat.sql — the schema is at the platform's 10-index-per-entity cap"
  eraIndex: Int

  "relation is `createdEvent` to avoid colliding with the denormalised `eventId` enum column, same as `AssetTransaction`"
  createdEvent: Event!
  extrinsic: Extrinsic
  eventIdx: Int!
  datetime: Date!
  "denormalised block id — `findBlockEntries` filters `= blockId` and `getByFields` has no range op (D13)"
  blockId: String! @index
}

"""
Materialised POLYX balance for one account. Versioned on `historical: 'height'`,
so `accountBalance(id: X, blockHeight: N)` gives the balance at block N.
"""
type AccountBalance @entity {
  "address"
  id: ID!
  account: Account!
  identity: Identity @index

  free: BigInt!
  reserved: BigInt!
  "MAX over active locks — maintained from `locks`, never summed"
  frozen: BigInt!
  total: BigInt!
  "free - frozen, floored at 0"
  transferable: BigInt!
  bonded: BigInt!
  otherReserved: BigInt!

  "lifetime totals — free, this row is already versioned on these blocks"
  totalReceived: BigInt!
  totalSent: BigInt!
  totalFeesPaid: BigInt!
  totalRewards: BigInt!
  totalSlashed: BigInt!
  movementCount: Int!
  lifetimeByKind: [KindTotal]

  "per-lock detail — required because frozen is a MAX"
  locks: [LockEntry]
  "v8 only; SUM = reserved"
  holds: [HoldEntry]

  updatedEvent: Event!
}

"""
Represents the parent child mapping for an Identity
"""
type ChildIdentity @entity {
  id: ID!
  child: Identity!
  parent: Identity!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents signer types
"""
enum SignerTypeEnum {
  Account
  Identity
}

"""
Represents a MultiSig

A multisig *is* an account — it holds POLYX, holds assets, and signs — so it is linked to its
`Account` row rather than carrying a bare address string (defect G5). The account's address is the
`MultiSig` id.
"""
type MultiSig @entity {
  id: ID!
  "The multisig's own account — `account.address` is the multisig address, `id` is the same string"
  account: Account! @index(unique: true)
  """
  The identity that dispatched `create_multisig` (the `MultiSigCreated` event's `callerDid`).

  NULL for a multisig that existed at genesis: the chain keeps no `creator` storage (only
  `multiSig.adminDid` and `multiSig.payingDid`), so for a row not observed being created the
  creator is unrecoverable. Do NOT read this as "who controls it" — that is `admins`, which is
  mutable (`multiSig.adminDid`, changed via `add_admin` / `remove_admin`) — nor as "which identity
  it acts for", which is `account.identity` (the multisig joined to an identity as a key). Those
  are three separate facts; pre-7.x `create_multisig` happened to set all of creator-and-admin at
  once, which is where the old conflation came from.
  """
  creator: Identity
  "The account that dispatched `create_multisig` (the event's `caller`). NULL for genesis rows."
  creatorAccount: Account
  signaturesRequired: Int!
  signers: [MultiSigSigner]! @derivedFrom(field: "multisig")
  proposals: [MultiSigProposal]! @derivedFrom(field: "multisig")
  admins: [MultiSigAdmin!] @derivedFrom(field: "multisig")
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents MultiSig signer status
"""
enum MultiSigAdminStatusEnum {
  Authorized ## when a admin is added
  Removed ## when admin has been removed
}

"""
Represents a MultiSig admin
"""
type MultiSigAdmin @entity {
  id: ID!
  multisig: MultiSig! @index(unique: false)
  "The administering identity — from `multiSig.adminDid` (genesis) or `MultiSigAddedAdmin` (defect G5)"
  admin: Identity! @index(unique: false)
  status: MultiSigAdminStatusEnum!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents MultiSig signer status
"""
enum MultiSigSignerStatusEnum {
  Authorized ## when a signer is added
  Approved ## when authorization is accepted by the signer
  Removed ## when signer has been removed
}

"""
Represents a MultiSig signer
"""
type MultiSigSigner @entity {
  id: ID!
  multisig: MultiSig! @index(unique: false)
  signerType: SignerTypeEnum!
  """
  The canonical signer value. Kept as the source of truth: `SignerTypeEnum` is `Account | Identity`
  and pre-7.x runtimes allowed identity signers, which a relation cannot point at, and the index
  replays history from genesis.
  """
  signerValue: String!
  "The signer's account — set only when `signerType` is `Account`; a signer key is an account (G16)"
  signerAccount: Account @index(unique: false)
  status: MultiSigSignerStatusEnum!
  votes: [MultiSigProposalVote]! @derivedFrom(field: "signer")
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents the list of proposal status
"""
enum MultiSigProposalStatusEnum {
  Active
  Approved
  Success
  Failed
  Rejected
  Deleted
}

"""
Represents bridge transaction
"""
type BridgeTx @jsonField {
  nonce: String!
  amount: String!
  txHash: String!
  recipient: String!
}

"""
Represents a single MultiSigProposal Call
"""
type SingleProposal @jsonField {
  module: String!
  call: String!
  args: String!
}

type MultiSigProposalParams @jsonField {
  isBridge: Boolean!
  isBatch: Boolean!
  proposals: [SingleProposal!]
  bridge: [BridgeTx!]
  expiry: String
  autoClose: Boolean
}

"""
Represents a MultiSig proposal
"""
type MultiSigProposal @entity {
  id: ID!
  multisig: MultiSig! @index(unique: false)
  proposalId: Int! @index(unique: false)
  creator: Identity
  creatorAccount: String
  status: String! @index(unique: false)
  approvalCount: Int!
  rejectionCount: Int!
  datetime: Date!
  eventIdx: Int!
  extrinsicIdx: Int
  params: MultiSigProposalParams!
  votes: [MultiSigProposalVote]! @derivedFrom(field: "proposal")
  updatedEvent: Event!
  extrinsic: Extrinsic
  createdEvent: Event!
}

"""
Represents action performed on MultiSig proposal
"""
enum MultiSigProposalVoteActionEnum {
  Approved
  Rejected
}

"""
Represents a MultiSig proposal vote
"""
type MultiSigProposalVote @entity {
  id: ID!
  proposal: MultiSigProposal! @index(unique: false)
  signer: MultiSigSigner! @index(unique: false)
  action: MultiSigProposalVoteActionEnum
  datetime: Date!
  eventIdx: Int!
  extrinsicIdx: Int!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents the registered CustomClaimType
"""
type CustomClaimType @entity {
  id: ID!
  identity: Identity
  name: String!
  createdEvent: Event!
  updatedEvent: Event!
}

enum AffirmingPartyEnum {
  Sender
  Receiver
  Mediator
}

enum AffirmStatusEnum {
  Affirmed
  Rejected
}

enum ConfidentialSettlementStatusEnum {
  Pending
  Executed
  Rejected
  Finalized
}

enum ConfidentialAffirmationStatusEnum {
  Affirmed
  Rejected
  Reverted
  Finalized
}

enum ConfidentialCurveTreeEnum {
  Asset
  Account
  FeeAccount
}

"""
A mediator's confidential account public key and encryption key pair
"""
type MediatorKey @jsonField {
  accountKey: String!
  encryptionKey: String!
}

"""
Represents a confidential account (account public key)
"""
type ConfidentialAccount @entity {
  id: ID!
  account: String!
  encryptionKey: String!
  creator: Identity!
  eventIdx: Int!
  assets: [ConfidentialAccountAsset!]! @derivedFrom(field: "account")
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents a registered encryption key. Registered either with a confidential account or
standalone for mediators/auditors
"""
type ConfidentialEncryptionKey @entity {
  id: ID!
  encryptionKey: String!
  creator: Identity!
  eventIdx: Int!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents a confidential asset
"""
type ConfidentialAsset @entity {
  id: ID!
  assetId: Int!
  name: String
  symbol: String
  decimals: Int!
  data: String
  creator: Identity!
  auditors: [String!]!
  mediators: [MediatorKey!]!
  totalSupply: BigInt!
  eventIdx: Int!
  holders: [ConfidentialAccountAsset!]! @derivedFrom(field: "asset")
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents the registration of a confidential asset to a confidential account
"""
type ConfidentialAccountAsset @entity {
  id: ID!
  account: ConfidentialAccount! @index(unique: false)
  asset: ConfidentialAsset! @index(unique: false)
  eventIdx: Int!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents a confidential settlement. On chain settlement state (legs, memo and affirmation
statuses) is pruned at finalization, so these records are the durable history
"""
type ConfidentialSettlement @entity {
  id: ID!
  memo: String
  """
  The block number of the asset curve tree root the settlement proof was built against
  """
  assetRootBlock: Int!
  legCount: Int!
  status: ConfidentialSettlementStatusEnum!
  legs: [ConfidentialLeg!]! @derivedFrom(field: "settlement")
  eventIdx: Int!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents a leg of a confidential settlement
"""
type ConfidentialLeg @entity {
  id: ID!
  settlement: ConfidentialSettlement! @index(unique: false)
  legId: Int!
  """
  SCALE encoded encrypted leg data (hex). Pruned from chain storage when the settlement is finalized
  """
  encryptedData: String!
  affirmations: [ConfidentialLegAffirmation!]! @derivedFrom(field: "leg")
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents the latest affirmation status of a party (sender, receiver or mediator) for a
confidential settlement leg. A party without a record has not yet affirmed
"""
type ConfidentialLegAffirmation @entity {
  id: ID!
  settlement: ConfidentialSettlement! @index(unique: false)
  leg: ConfidentialLeg! @index(unique: false)
  party: AffirmingPartyEnum!
  """
  The mediator key index (only set when party is Mediator)
  """
  keyIndex: Int
  status: ConfidentialAffirmationStatusEnum!
  eventIdx: Int!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents a leaf of one of the confidential assets curve trees. The account and fee account
trees are append only, while asset tree leaves can be updated in place
"""
type ConfidentialCurveTreeLeaf @entity {
  id: ID!
  tree: ConfidentialCurveTreeEnum! @index(unique: false)
  leafIndex: BigInt!
  """
  The compressed leaf value commitment (hex)
  """
  value: String!
  eventIdx: Int!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represent asset pre-approvals from an Identity. These entries will not require an affirmation when the identity is receiving them
"""
type AssetPreApproval @entity {
  id: ID!
  asset: Asset! @index(unique: false)
  identity: Identity! @index(unique: false)
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents a ticker reservation. If linked to an Asset `asset` will be set
"""
type TickerReservation @entity {
  id: ID!
  ticker: String!
  asset: Asset
  identity: Identity! @index(unique: false)
  "When the ticker reservation lapses. UTC, serialised with no timezone marker — parse as UTC (e.g. append 'Z'), not local time; see docs/architecture-review.md §10.1"
  expiry: Date
  createdEvent: Event!
  updatedEvent: Event!
}
