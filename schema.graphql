  Rejected
  Scheduled
  Failed
  Executed
  Expired
}

enum SnapshotEnum {
  All
  InSnapshot
  NotInSnapshot
}

"""
Represents where this claim may apply
"""
type Proposer @jsonField {
  type: String!
  value: String!
}

"""
Represents a potential change to how the chain will operate. It will need gain sufficient "Aye" votes before having effect
"""
type Proposal @entity {
  "The chain's numeric PIP sequence, zero-padded to 10 digits (D12) so `ID` ordering is numeric. Filter by a literal id with the padded form."
  id: ID!
  proposer: Proposer!
  state: ProposalStateEnum!
  owner: Identity!
