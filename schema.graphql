type Debug @entity {
  id: ID!
  line: String
  context: String
}

type FoundType @entity {
  id: ID!
  rawType: String!
}

"""
A set of transactions that were executed together. Includes a reference to its parent, which reference its parent, this forms a chain to the genesis block

This table is sparse: a row is only written for a block that produced at least one handled
event, so it is NOT a freshness signal. `MAX(blockId)` can sit minutes behind the chain head
while the indexer is perfectly current. To check indexer liveness, read
`_metadata.lastProcessedHeight` instead.
"""
type Block @entity {
  id: ID!
  blockId: Int! @index(unique: true)
  parentId: Int!
  hash: String! @index(unique: true) # a hash value
  parentHash: String! @index(unique: false)
  stateRoot: String!
  extrinsicsRoot: String!
  countExtrinsics: Int!
  countExtrinsicsUnsigned: Int!
  countExtrinsicsSigned: Int!
  countExtrinsicsError: Int!
  countExtrinsicsSuccess: Int!
  countEvents: Int!
  """
  Block timestamp. UTC — but this applies to EVERY `Date`/`datetime` field in the API:
  SubQuery types `Date` as Postgres `timestamp without time zone`, so it is serialised
  with no zone marker (`"2021-11-05T13:56:36"`). A consumer calling `new Date(value)`
  in most runtimes gets *local* time, shifting it silently by its own offset. Parse
  every datetime as UTC — `new Date(value + 'Z')`, or `dayjs.utc(value)`. See
  docs/architecture-review.md §10.1 (decision D8).
  """
  datetime: Date!
  specVersionId: Int!
  events: [Event] @derivedFrom(field: "block")
  extrinsics: [Extrinsic] @derivedFrom(field: "block")
}

"""
A runtime upgrade the indexer observed, one row per spec version.

Written from `system.CodeUpdated`, which the runtime emits for every upgrade. Two things read
it: upgrade detection itself, which was module level mutable state and so held a separate copy
per worker thread, and any handler that needs the block a spec version started at.
"""
type ChainUpgrade @entity {
  "Zero padded spec version, so lexical order matches numeric order"
  id: ID!
  specVersionId: Int! @index(unique: true)
  """
  Transaction version the upgrade shipped. A bump here means the call encoding changed, which is
  what distinguishes a major upgrade from a routine one
  """
  transactionVersion: Int!
  "The block `system.CodeUpdated` was emitted in"
  firstBlock: Block!
  datetime: Date!
}

"""
Represents external data included into the chain. Virtually all user actions, as well as runtime operations are extrinsics

Usually extrinsics are signed. When the block author includes data, e.g. `timestamp.set` then the signature is implied. This is indicated with `signed = 0`
"""
type Extrinsic @entity {
  id: ID!
  block: Block! @index(unique: false)
  extrinsicIdx: Int! @index(unique: false)
  extrinsicLength: Int!
  signed: Int! @index(unique: false)
  "`signedbyAddress` is now deprecated in favour of `signed`"
  signedbyAddress: Int! @deprecated(reason: "use `signed` instead.")
  address: String @index(unique: false)
  moduleId: ModuleIdEnum! @index
  moduleIdText: String!
  callId: CallIdEnum! @index
  callIdText: String!
  paramsTxt: String!
  success: Int! @index(unique: false)
  nonce: Int
  extrinsicHash: String @index(unique: false)
  """
  Checksummed Ethereum address of the key that signed this `revive.eth_transact` extrinsic. `null` for every other extrinsic.

  The equivalent SS58 address, formed by padding this address with 12 `0xEE` bytes, is stored in `address`
  """
  ethAddress: String @index(unique: false)
  "The keccak256 of the RLP payload, i.e. the transaction hash an Ethereum wallet reports"
  ethTxHash: String @index(unique: false)
  specVersionId: Int!
  "Every event this extrinsic emitted, in event order. The reverse of `Event.extrinsic` (D13)."
  events: [Event] @derivedFrom(field: "extrinsic")
}

"""
The `revive` call an `eth_transact` extrinsic is transformed into by the runtime
"""
enum EvmCallKindEnum {
  "`revive.eth_call` - a call to a contract or precompile"
  call
  "`revive.eth_instantiate_with_code` - a contract deployment"
  instantiate
  "`revive.eth_substrate_call` - a native runtime call, dispatched by targeting the `modlpy/paddr` address"
  substrateCall
}

"""
An Ethereum transaction submitted through `revive.ethTransact`, decoded from the RLP payload of the extrinsic.

The chain includes these as unsigned extrinsics, so the signer, the dispatched call and whether the transaction reverted are all recovered by the indexer
"""
type EvmTransaction @entity {
  "Same ID as the `Extrinsic` that carried this transaction"
  id: ID!
  extrinsic: Extrinsic!
  block: Block! @index(unique: false)
  "The keccak256 of the RLP payload, i.e. the transaction hash an Ethereum wallet reports"
  ethTxHash: String! @index(unique: false)
  "0 for legacy, 1 for EIP-2930, 2 for EIP-1559"
  ethTxType: Int!
  callKind: EvmCallKindEnum!
  "Checksummed Ethereum address that signed the transaction"
  fromEthAddress: String! @index(unique: false)
  "SS58 encoding of the `0xEE` padded account the runtime dispatched the call as"
  fromAddress: String! @index(unique: false)
  "`null` for a contract deployment"
  toEthAddress: String @index(unique: false)
  "Address of the deployed contract, taken from `revive.Instantiated`"
  contractAddress: String @index(unique: false)
  value: String!
  ethNonce: BigInt!
  gasLimit: String!
  "Only set for legacy and EIP-2930 transactions"
  gasPrice: String
  "Only set for EIP-1559 transactions"
  maxFeePerGas: String
  "Only set for EIP-1559 transactions"
  maxPriorityFeePerGas: String
  chainId: String
  "Hex encoded calldata. For a `substrateCall` this is the SCALE encoded runtime call"
  input: String!
  "An Ethereum transaction always succeeds at the extrinsic level. This flags the ones that reverted"
  reverted: Boolean! @index(unique: false)
  revertReason: String
  datetime: Date!
  createdBlock: Block!
  updatedBlock: Block!
}

"""
Mapping between an Ethereum address and its original `AccountId32`, registered with `revive.mapAccount`
"""
type EvmAccountMapping @entity {
  "Same ID as `evmAddress`"
  id: ID!
  "Checksummed Ethereum address the account is reachable at inside `pallet_revive`. Same value as `id`"
  evmAddress: String!
  "SS58 address of the account that registered the mapping"
  address: String! @index(unique: true)
  account: Account
  "`false` once the mapping has been removed with `revive.unmapAccount`"
  mapped: Boolean!
  datetime: Date!
  createdBlock: Block!
  updatedBlock: Block!
}

"""
Information of a chain state transition on. For most use cases a more specific entity should be queried
"""
type Event @entity @compositeIndexes(fields: [["moduleId", "eventId"]]) {
  id: ID!
  block: Block! @index(unique: false)
  eventIdx: Int! @index(unique: false)
  extrinsicIdx: Int @index(unique: false)
  specVersionId: Int! @index(unique: false)
  moduleId: ModuleIdEnum! @index
  moduleIdText: String!
  eventId: EventIdEnum! @index
  eventIdText: String!
  attributesTxt: String!
  "Indexed in `db/compat.sql` as `left(event_arg_0, 100)`, which no directive can express"
  eventArg_0: String
  eventArg_1: String
  eventArg_2: String
  eventArg_3: String
  extrinsic: Extrinsic
}

"""
What the indexer could not decode or resolve.

Every value here names a specific failure the indexer would otherwise have swallowed - a
decoder that did not match the block's shape, an enum value the schema does not know, a
referenced entity that was never written.
"""
enum AnomalyKind {
  "An event carried a different number of parameters than the decoder registered for its spec version declares"
  ArityMismatch
  "A named field lookup found no field of that name in the block's own metadata"
  FieldNotFound
  "No legacy decoder covers the spec version of the block the event was emitted in"
  NoDecoderForSpecVersion
  "A chain value did not match any member of the schema enum it maps to, and fell back to the `Unknown` member"
  UnknownEnumValue
  "A handler resolved a relation to an entity that does not exist in the index"
  MissingReferencedEntity
  "An accumulated balance disagreed with the same balance read from chain state"
  BalanceReconciliationDrift
  "A handler threw. The index is missing whatever that handler would have written"
  HandlerError
}

"""
Recorded whenever the indexer could not decode or resolve something.

This table is a defect list, not a log. Every row is either a genuine chain oddity worth
documenting or an indexer bug worth fixing, so a full resync that leaves it empty is the
acceptance signal. Query `(kind, moduleId, eventId)` distinct to review them.
"""
type IndexerAnomaly @entity {
  "`blockId/eventIdx/seq`, each part zero padded so lexical order matches emission order"
  id: ID!
  kind: AnomalyKind! @index
  "The pallet the event came from, where the anomaly is attributable to one"
  moduleId: ModuleIdEnum @index
  "The event the anomaly is attributable to, where there is one"
  eventId: EventIdEnum @index
  "What was expected against what was seen - an arity, a field name, an entity id"
  detail: String!
  specVersionId: Int! @index
  block: Block!
  createdAt: Date!
}

