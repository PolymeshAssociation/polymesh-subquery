  deletedAt: Date
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents a place to trade assets. This allows for additional mediation and control over the exchange of Assets

e.g. An asset may specify it can only be exchanged at a particular Venue, allowing the Venue owner to explicitly approve transactions
"""
type Venue @entity {
  "The chain's numeric venue sequence, zero-padded to 10 digits (D12) so `ID` ordering is numeric. Filter by a literal id with the padded form."
  id: ID! # venueId
  owner: Identity!
  type: String!
  details: String
  instructions: [Instruction!] @derivedFrom(field: "venue")
  signers: [String!]!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents all possible states of an Instruction
"""
enum InstructionStatusEnum {
  Created
  Executed
  Rejected
  Failed
  Locked
}

"""
Represents types of an Instruction
"""
enum InstructionTypeEnum {
  SettleOnAffirmation
  SettleOnBlock
  SettleManual
  SettleAfterLock
}

type ErrorJson @jsonField {
  errorType: String
  details: String
}

"""
Represents a request to exchange Assets between parties.

Before an Instruction is executed all involved parties must sign and submit an affirmation.
Once an Instruction is affirmed it will then be attempted to be executed.
If any party fails to satisfy any compliance or transfer restriction the Instruction will fail,
and no movement of assets will occur.
"""
type Instruction @entity {
  """
  The chain's numeric instruction sequence, stored as text and zero-padded to 10
  digits (D12), so `orderBy: [ID_ASC/DESC]` is a total order that matches
  id-assignment (chronological) order. Filter by a literal id with the padded
  form, e.g. `id: { equalTo: "0000014712" }`.
  """
  id: ID!
  status: InstructionStatusEnum!
  venue: Venue @index(unique: false)
  type: InstructionTypeEnum!
  "`endBlock` is applicable only when `type` is `SettleOnBlock`"
  endBlock: Int
  "`endAfterBlock` is applicable only when `type` is `SettleManual`"
  endAfterBlock: Int
  """
  The trade date, as reported by the chain. UTC, but serialised with no timezone
  marker: a consumer receives `"2021-11-05T13:56:36"` and `new Date(...)` parses it
  as *local* time, shifting it silently by the reader's offset. Parse as UTC — e.g.
  `new Date(value + 'Z')`. See docs/architecture-review.md §10.1.
  """
  tradeDate: Date
  "The value date, as reported by the chain. UTC, serialised with no timezone marker — parse as UTC (e.g. append 'Z'), not local time; see docs/architecture-review.md §10.1"
  valueDate: Date
  memo: String
  "DID of the mediators"
  mediators: [String!]!
  failureReason: ErrorJson
  legs: [Leg!]! @derivedFrom(field: "instruction")
  parties: [InstructionParty]! @derivedFrom(field: "instruction")
  affirmations: [InstructionAffirmation]! @derivedFrom(field: "instruction")
  events: [InstructionEvent]! @derivedFrom(field: "instruction")
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents all possible states of an Instruction
"""
enum LegTypeEnum {
  Fungible
  NonFungible
  OffChain
}

"""
Represents the movement of a single Asset in a trade, e.g. Alice will give Bob 1 USDS
"""
type Leg @entity {
  id: ID! # instructionId/legIndex
  instruction: Instruction!
  legIndex: Int!
  legType: LegTypeEnum!
  "`assetId` can be ID of the asset for the on chain or ticker of an off chain asset"
  assetId: String! @index(unique: false)
  ticker: String @index(unique: false)
  from: String! @index(unique: false)
  fromAccount: String
  "`fromPortfolio` is null for off chain legs"
  fromPortfolio: Int
  to: String! @index(unique: false)
  toAccount: String
  "`toPortfolio` is null for off chain legs"
  toPortfolio: Int
  "`amount` is null for non-fungible legs"
  amount: BigInt
  "`nftIds` is only applicable for non-fungible legs"
  nftIds: [BigInt]
  addresses: [String!]!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents a relationship between Identities and Instructions they are involved in
"""
type InstructionParty @entity {
  id: ID!
  instruction: Instruction! @index(unique: false)
  isMediator: Boolean!
  "`identity` is the DID of the party involved in the instruction. No mapping to Identity is added, since instruction can have leg (e.g. off chain) where DID doesn't exists"
  identity: String! @index(unique: false)
  "`portfolios` depicts which portfolios for the identity are involved in the instructions. Legs can have different portfolios of a same identity involved"
  portfolios: [Int]
  affirmations: [InstructionAffirmation]! @derivedFrom(field: "party")
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents an off chain receipt
"""
type OffChainReceipt @entity {
  id: ID!
  uid: Int! @index(unique: false)
  signer: String! @index(unique: false)
  leg: Leg
  metadata: String
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents affirmations received on an Instruction
"""
type InstructionAffirmation @entity {
  id: ID!
  instruction: Instruction! @index(unique: false)
  party: InstructionParty!
  identity: String! @index(unique: false)
  account: String
  "`portfolio` will be null for mediator affirmation and off chain affirmation"
  portfolios: [Int]
  isMediator: Boolean!
  isAutomaticallyAffirmed: Boolean!
  status: AffirmStatusEnum!
  "If `expiry` is present the time should be checked to ensure the affirmation is still valid. Applicable for mediator affirmations. UTC, serialised with no timezone marker — parse as UTC (e.g. append 'Z'), not local time; see docs/architecture-review.md §10.1"
  expiry: Date
  "`offChainReceipt` is only applicable when affirmation"
  offChainReceipt: OffChainReceipt
  createdEvent: Event!
  updatedEvent: Event!
}

enum InstructionEventEnum {
  FailedToExecuteInstruction
  InstructionCreated
  InstructionAffirmed
  InstructionAutomaticallyAffirmed
  InstructionExecuted
  InstructionFailed
  InstructionLocked
  InstructionUnlocked
  InstructionMediators
  AffirmationWithdrawn
  InstructionRejected
  InstructionRescheduled
  LegFailedExecution
  MediatorAffirmationReceived
  MediatorAffirmationWithdrawn
  ReceiptClaimed
  SchedulingFailed
  SettlementManuallyExecuted
  VenueCreated
  VenueDetailsUpdated
  VenueFiltering
  VenueSignersUpdated
  VenueTypeUpdated
  VenueUnauthorized
  VenuesAllowed
  VenuesBlocked
}

"""
Represents events associated with an Instruction
"""
type InstructionEvent @entity {
  id: ID!
  instruction: Instruction! @index(unique: false)
  event: InstructionEventEnum!
  eventIdx: Int!
  identity: String @index(unique: false)
  portfolio: Int
  account: String
  offChainReceipt: OffChainReceipt
  failureReason: ErrorJson
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents a distribution to the owners of an Asset. e.g. dividend payment
"""
type Distribution @entity {
  id: ID! # assetId/localId
  identity: Identity!
  localId: Int! @index(unique: false)
  asset: Asset! @index(unique: false)
  portfolio: Portfolio!
  currency: Asset!
  perShare: BigInt!
  amount: BigInt!
  remaining: BigInt!
  paymentAt: BigInt!
  expiresAt: BigInt
  taxes: BigInt! # withheld tax for CA
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents an owner of an asset collecting a distribution e.g. accepting a dividend
"""
type DistributionPayment @entity {
  id: ID!
  distribution: Distribution!
  target: Identity!
  eventId: EventIdEnum!
  amount: BigInt!
  tax: BigInt!
  amountAfterTax: BigInt!
  reclaimed: Boolean!
  "When the benefit was claimed. UTC, serialised with no timezone marker — parse as UTC (e.g. append 'Z'), not local time; see docs/architecture-review.md §10.1"
  datetime: Date!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents a vote on a governance proposal
"""
type ProposalVote @entity {
  id: ID!
  proposal: Proposal!
  account: String!
  vote: Boolean!
  weight: BigInt!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents all possible Proposal statuses
"""
enum ProposalStateEnum {
  All
