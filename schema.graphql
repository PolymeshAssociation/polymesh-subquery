"""
Represents all possible claims that can be made of an identity
"""
enum ClaimTypeEnum {
  Accredited
  Affiliate
  BuyLockup
  SellLockup
  Custom
  CustomerDueDiligence
  KnowYourCustomer
  Jurisdiction
  Exempted
  Blocked
  InvestorUniqueness
  NoData
  InvestorUniquenessV2
  NoType
}

"""
Represents all possible scopes a claim may have
"""
enum ClaimScopeTypeEnum {
  Identity
  "@deprecated in favour of `Asset`"
  Ticker
  Asset
  Custom
}

"""
Represents where this claim may apply
"""
type Scope @jsonField {
  type: String!
  value: String!
  "`assetId` is only present when `type` is `Asset`"
  assetId: String
}

