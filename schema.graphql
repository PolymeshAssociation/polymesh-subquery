  cddId: String
  customClaimType: CustomClaimType
  revokeDate: BigInt
  updatedEvent: Event!
  createdEvent: Event!
}

"""
An claim issuer that is trusted for an Asset.

Assets relying on on chain compliance should be explicit on which issuers they trust
"""
type TrustedClaimIssuer @entity {
  id: ID!
  asset: Asset! @index(unique: false)
  issuer: Identity! @index(unique: false)
  eventIdx: Int!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
An off chain identifier for a given Asset. e.g. ISIN, CUSIP, FIGI, etc.
"""
type SecurityIdentifier @jsonField {
  type: String!
  value: String!
}

"""
Represents all possible transfer restriction types
"""
enum TransferRestrictionTypeEnum {
  Count
  Percentage
}

"""
deprecated in favor of `TransferCompliance`
"""
type TransferManager @entity {
  id: ID! # assetId/transferManagerType/value
  asset: Asset! @index(unique: false)
  type: TransferRestrictionTypeEnum!
  value: Int!
  exemptedEntities: [String]!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents all known stat types
"""
enum StatOpTypeEnum {
  Count
  Balance
}

"""
Represents an on chain statistic about the Asset owners. e.g. How many investors hold the Asset

These are required to be enabled in order for the chain to enforce transfer restrictions

e.g. A restriction requiring ownership to be at least 50% Canadian would require a StatType of type `Balance` scoped to Jurisdiction before being created
"""
type StatType @entity {
  id: ID! # assetId/op/type/claimIssuer
  asset: Asset!
  opType: StatOpTypeEnum!
  claimType: ClaimTypeEnum
  customClaimType: CustomClaimType
  claimIssuer: Identity
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents all possible transfer restriction rules that can be enabled
"""
enum TransferComplianceTypeEnum {
  MaxInvestorCount
  MaxInvestorOwnership
  ClaimCount
  ClaimOwnership
}

"""
Represents restriction that will ensure the composition of ownership remains a certain way

e.g. No more than 2000 individual investors to avoid additional reporting requirements
"""
type TransferCompliance @entity {
  id: ID! # assetId/op/type/claimIssuer
  asset: Asset! @index(unique: false)
  type: TransferComplianceTypeEnum!
  statType: StatType!
  # value is present only in case of MaxInvestorCount and MaxInvestorOwnership
  value: BigInt
  # following values are present in case of ClaimCount and ClaimOwnership
  claimType: ClaimTypeEnum
  claimValue: String
  claimIssuer: Identity
  min: BigInt
  max: BigInt
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents an exemption for an individual for TransferCompliance rules
"""
type TransferComplianceExemption @entity {
  id: ID! #asset/opType/claimType/exemptedEntityId
  asset: Asset! @index(unique: false)
  opType: StatOpTypeEnum!
  claimType: ClaimTypeEnum
  exemptedEntityId: String!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents a restriction all investor must comply with for a given Asset

e.g. All investors must be German citizens
"""
type Compliance @entity {
  id: ID! # assetId/complianceId
  complianceId: Int!
  data: String! # This could be expanded into structured data
  asset: Asset! @index(unique: false)
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents how much of a given Asset an Identity owns
"""
type AssetHolder @entity {
  id: ID! # assetId/did
  identity: Identity! @index(unique: false)
  asset: Asset! @index(unique: false)
  amount: BigInt!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents what NFTs of a collection an Identity owns
"""
type NftHolder @entity {
  id: ID! #assetId/did
  identity: Identity! @index(unique: false)
  asset: Asset! @index(unique: false)
  nftIds: [BigInt]
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Discriminates the grain a `Holding` is keyed at: a portfolio (identity model) or a v8
account-level holder.
"""
enum HolderKind {
  Portfolio
  Account
}

"""
One key/value pair of an NFT's on-chain metadata.
"""
type NftMetadataEntry @jsonField {
  key: String!
  value: String!
}

"""
One row per individual non-fungible token — the authoritative per-token record (defects G9, G10).
The `NftHolder` rollup is kept alongside for the SDK, but provenance ("who owns NFT #42?", "where
has it been?") is answered here.
"""
type Nft @entity @compositeIndexes(fields: [["asset", "nftId"]]) {
  id: ID! # assetId/padId(nftId)
  "the collection this token belongs to"
  asset: Asset!
  "BigInt everywhere — resolves G10"
  nftId: BigInt!
  "current location; exactly one of portfolio / account is set while the token is in circulation"
  portfolio: Portfolio
  account: Account
  identity: Identity
  metadata: [NftMetadataEntry]
  createdEvent: Event!
  "null = still in circulation. Filter `burnedEventId: { isNull: true }` — Boolean cannot be indexed"
  burnedEvent: Event
  updatedEvent: Event!
}

"""
One row per (asset, holder) at the finest grain the chain uses — a portfolio, or a v8
account-level holder. Identity-level holdings are derived from these (see `AssetHolder` /
`NftHolder`, kept as maintained rollups), never stored as primary truth.
"""
type Holding
  @entity
  @compositeIndexes(fields: [["asset", "identity"], ["portfolio", "asset"]]) {
  id: ID! # assetId/portfolioId  or  assetId/address
  asset: Asset!
  holderKind: HolderKind!
  "set when `holderKind` is `Portfolio`"
  portfolio: Portfolio
  "set when `holderKind` is `Account` (v8 account-level holder)"
  account: Account
  "denormalised — makes the identity rollup a groupBy, not a join. Null when the holder account has no known identity"
  identity: Identity
  "fungible balance held"
  amount: BigInt!
  "count of non-fungible tokens held; the ids live on `Nft`"
  nftCount: Int!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents a hash of a document
"""
type ContentHash @jsonField {
  type: String
  value: String
}

"""
Represents off chain documentation for an Asset. A hash should be included on chain so readers can be sure their copy has not been tampered with

e.g. A companies 10-K report
"""
type AssetDocument @entity {
  id: ID! # assetId/documentId
  documentId: Int!
  name: String!
  link: String!
  contentHash: ContentHash
  type: String
  "When the document was filed. UTC, serialised with no timezone marker — parse as UTC (e.g. append 'Z'), not local time; see docs/architecture-review.md §10.1"
  filedAt: Date
  asset: Asset! @index(unique: false)
  createdEvent: Event!
  updatedEvent: Event!
}

"""
Represents a tokenized Asset on the Polymesh chain. The central data structure for the ecosystem
"""
type Asset @entity {
  id: ID! # assetId
  "the chain's own asset id — equal to `id`; on 7.x+ the on-chain AssetId, the blake2-hashed legacy ticker before that"
  assetId: String! @index(unique: true)
  ticker: String @index(unique: false)
  name: String @index(unique: false)
  isNftCollection: Boolean!
  type: String @index(unique: false)
  fundingRound: String @index(unique: false)
  isDivisible: Boolean!
  isFrozen: Boolean!
  "number of holders with a non-zero balance — maintained where `Holding` rows cross zero"
  holderCount: Int!
  identifiers: [SecurityIdentifier]!
  owner: Identity!
  documents: [AssetDocument]! @derivedFrom(field: "asset")
  holders: [AssetHolder]! @derivedFrom(field: "asset")
  holdings: [Holding!]! @derivedFrom(field: "asset")
  nfts: [Nft!]! @derivedFrom(field: "asset")
  totalSupply: BigInt!
  totalTransfers: BigInt!
  isCompliancePaused: Boolean!
  compliance: [Compliance]! @derivedFrom(field: "asset")
  transferManagers: [TransferManager]! @derivedFrom(field: "asset")
  trustedClaimIssuers: [TrustedClaimIssuer]! @derivedFrom(field: "asset")
  mandatoryMediators: [AssetMandatoryMediator]! @derivedFrom(field: "asset")
  eventIdx: Int!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
Represents all the transactions related to an Asset
"""
type AssetTransaction @entity {
  id: ID!
  asset: Asset!
  "`fromPortfolioId` will be null in transactions where either the Asset was issued or the sender is an account"
  fromPortfolio: Portfolio
  "`fromAccount` will be populated when asset transaction has initiated directly from an account"
  fromAccount: String
  "`fromIdentityId` is the DID of the sender, present for transfers and redemptions. Stored separately from portfolio/account to preserve historical queryability when accounts change identity"
  fromIdentity: Identity @index(unique: false)
  "`toPortfolioId` will be null in transactions where either the Asset was redeemed or the receiver is an account"
  toPortfolio: Portfolio
  "`toAccount` will be populated when asset transaction has settled directly into an account"
  toAccount: String
  "`toIdentityId` is the DID of the receiver, present for issuances and transfers. Stored separately from portfolio/account to preserve historical queryability when accounts change identity"
  toIdentity: Identity @index(unique: false)
  "`amount` is the number of fungible tokens involved in this transaction"
  amount: BigInt
  "`nftIds` are the IDs of the non-fungible tokens involved in this transaction"
  nftIds: [BigInt]
  eventId: EventIdEnum!
  eventIdx: Int!
  "`extrinsicIdx` will be null for scheduled transactions"
  extrinsicIdx: Int
  "`fundingRound` will only be present for the cases where Assets are issued with a fundingRound name"
  fundingRound: String
  "`instruction` will only be present for the cases where Assets are transferred once instruction is executed"
  instruction: Instruction
  "`instructionMemo` will only be present for the cases where memo is provided for the instruction which got executed"
  instructionMemo: String
  "true when both sides belong to one Identity (a portfolio movement, or a settlement same-DID fast path); null for issuance and redemption. Not indexed — filter by plain equality"
  isInternalTransfer: Boolean
  "note attached to a portfolio movement or a settlement.transferFunds call"
  memo: String
  "the account that signed the extrinsic, for movements initiated directly by an account"
  address: String
  datetime: Date!
  updatedEvent: Event!
  createdEvent: Event!
}

"""
The scope a metadata key is registered in: `Local` to one asset, or `Global` across the chain.
"""
enum MetadataScope {
  Local
  Global
}

"""
A metadata key registered against an asset, with its current value (defect G13). Global keys
applied to an asset also land here; the chain-wide global key registry is `GlobalMetadataKey`.
"""
type AssetMetadata @entity {
  id: ID! # assetId/scope/keyId
  asset: Asset! @index(unique: false)
  scope: MetadataScope!
  "the numeric key id within its scope, as a string"
  keyId: String!
  "registered name of the key"
  name: String
  "current value, once one has been set"
  value: String
  "true while the value is Locked or LockedUntil"
  isLocked: Boolean!
  "Value expiry, when the detail carried one. UTC, serialised with no timezone marker — parse as UTC (e.g. append 'Z'), not local time; see docs/architecture-review.md §10.1"
  expiry: Date
  createdEvent: Event!
  updatedEvent: Event!
}

"""
A chain-wide global metadata key registration (name and id). Asset-scoped applications of a
