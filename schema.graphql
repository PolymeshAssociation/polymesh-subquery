"""
The role a key plays in the identity system, from the chain's own `KeyRecord`.

Distinct from `Account.keyType` (the cryptographic shape of the key). Treated as an OPEN set —
`Unlinked` currently covers pallet addresses, system pots, and deliberately-detached keys as one
label, and may be split later. A multisig's own account reads `PrimaryKey` / `SecondaryKey` per
its key record; multisig-ness is the `MultiSig` row keyed by the same address, not this field.
"""
enum KeyRoleEnum {
  PrimaryKey
  SecondaryKey
  MultiSigSigner
  "Pallet / system address, or a key with no current key record"
  Unlinked
}

"""
Represents a public/private key pair. Most actions must be signed by an appropriately permissioned Account

Before an Account can sign most Extrinsics it must first be attached to an Identity
"""
type Account @entity {
  id: ID!
  address: String! @index(unique: true)
  "`substrate` for a regular key, `ethereum` for the `0xEE` padded account of an Ethereum key"
  keyType: String!
  "The key's role in the identity system, from the chain's `KeyRecord` — mutable, maintained on every key-link/unlink write"
  keyRole: KeyRoleEnum! @index(unique: false)
  "Checksummed Ethereum address this account is reachable at inside `pallet_revive`"
  evmAddress: String @index(unique: false)
  identity: Identity
  "Every `IdentityKey` membership interval this account has held, current and historical"
  keyAssignments: [IdentityKey!]! @derivedFrom(field: "account")
  "Set when this account is a multisig — the account IS the multisig (defect G5)"
  multiSig: MultiSig @derivedFrom(field: "account")
  eventId: EventIdEnum!
  datetime: Date!
  createdEvent: Event!
  updatedEvent: Event!
}

"""
An account's permissions for one `IdentityKey` membership interval — the `Permissions` entity
collapsed into the jsonField that already carried the same four fields (defect G4).
"""
type PermissionsJson @jsonField {
  assets: AssetPermissions
  portfolios: PortfolioPermissions
  transactions: TransactionPermissions
  transactionGroups: [String]!
}

"""
Represents a person or business on chain. All Polymesh assets belong to an Identity. A single Identity can have many accounts (i.e. "keys")

An Identity needs a valid CDD claim from at least one KYC/KYB provider to perform most actions on chain
"""
type Identity @entity {
  id: ID!
  did: String! @index(unique: true)
  primaryAccount: String! @index(unique: false)
  secondaryKeysFrozen: Boolean!
  eventId: EventIdEnum!
  datetime: Date!
  createdEvent: Event!
  updatedEvent: Event!
  heldAssets: [AssetHolder]! @derivedFrom(field: "identity")
  heldNfts: [NftHolder]! @derivedFrom(field: "identity")
  portfolios: [Portfolio!]! @derivedFrom(field: "identity")
  children: [ChildIdentity!]! @derivedFrom(field: "parent")
  """
  Every key membership this Identity has held, current and historical — see `IdentityKey`.

  Replaces the removed `secondaryAccounts` field, which derived from `Account.identity` and so
  wrongly listed the primary key alongside the secondaries (defect G1). Current secondary keys are
  `keys(filter: { role: { equalTo: Secondary }, validToBlockId: { isNull: true } })`.
  """
  keys: [IdentityKey!]! @derivedFrom(field: "identity")
}

"""
The role a key holds inside an Identity.

Not a closed set — treat it as open. `MultiSigSigner` and detached-key roles are modelled on
`Account.keyRole` (a separate enum) rather than here, and further membership roles may be added.
"""
enum KeyRole {
  Primary
  Secondary
}

"""
One row per `(identity, account, role)` membership interval — an append-only key-rotation history.

A key joining an identity opens a row (`validFromBlock` set, `validToBlock` null). A key leaving,
being rotated out, or having its permissions changed closes the row (`validToBlock`,
`removedReason`) and, for a permissions change or rotation, opens a fresh one. The currently active
membership for an account is the row with `validToBlockId: { isNull: true }` (`Boolean` cannot be
indexed on the Postgres in use, so the null-FK filter is the query form).

Replaces `Identity.primaryAccount`/`secondaryAccounts` as the source of truth for key membership,
and subsumes `AccountHistory`, which had untyped columns and no validity interval.
"""
type IdentityKey @entity
  @compositeIndexes(fields: [["identity", "role"], ["account", "validToBlock"]]) {
  id: ID!
  identity: Identity! @index
  account: Account! @index
  role: KeyRole!
  "Permissions granted to the key for this interval. Null for a primary key, which always has full permission"
  permissions: PermissionsJson
  validFromBlock: Block!
  "Null while the membership is active. Filter `validToBlockId: { isNull: true }` for current keys"
  validToBlock: Block @index
  "The event that opened this membership interval"
  addedReason: EventIdEnum!
  "The event that closed it — null while active"
  removedReason: EventIdEnum
  createdEvent: Event!
  updatedEvent: Event!
}

